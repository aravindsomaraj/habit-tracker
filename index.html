<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker — Habit & Goal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="mark">🔥</span> Habit Tracker</div>
    <div class="spacer"></div>
    <button class="pillbtn" id="themeBtn">🌗 Theme</button>
    <button class="cta" id="newBtn">+ New habit</button>
  </header>

  <div id="storeNote"></div>

  <nav class="tabs" id="tabs">
    <button data-v="today" class="on">✅ Today</button>
    <button data-v="progress">📊 Progress</button>
    <button data-v="calendar">📅 Calendar</button>
    <button data-v="graph">📈 Graph</button>
    <button data-v="proof">📸 Proof</button>
    <button data-v="manage">⚙️ Habits</button>
  </nav>

  <main id="view"></main>
</div>

<div id="modalRoot"></div>

<!-- Classic scripts preserve the existing inline event handlers. Order matters. -->
<script src="assets/js/storage.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
